<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhiram Kothagundu</title>
<style>
  body {
    font-family: 'Times New Roman', sans-serif;
    margin: 0;
    scroll-behavior: smooth; /* Smooth scrolling */
  }
  section {
    width: 100%;
    height: 100vh; /* Full viewport height */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  h1, h2, h3, p {
    margin: 10px;
  }
  span {
    color: rgb(0, 0, 0);
    font-weight: bold;
  }
  .arrow {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    color: rgba(255, 255, 255, 0.3);
    cursor: pointer;
    transition: color 0.3s, transform 0.3s;
    opacity: 0.5;
  }
  .arrow:hover {
    color: black;
    transform: translateX(-50%) translateY(5px);
    opacity: 1;
  }
</style>
</head>
<body>
  <!-- Main section -->
  <section id="main">
    <h1>I'm Abhiram Kothagundu</h1>
    <h3>I'm <span id="age"></span> years old.</h3>
    <div class="arrow" onclick="scrollToSection('about')">&#x25BC;</div>
  </section>

  <!-- About section -->
  <section id="about">
    <h2>About Me</h2>
    <p>I'm good at C++, Java, Python, and C#.</p>
  </section>

<script>
  const birthDate = new Date('2005-04-05T13:05:00Z');

  function updateAge() {
    const now = new Date();
    const ageInMilliseconds = now - birthDate;
    const ageInYears = ageInMilliseconds / (1000 * 60 * 60 * 24 * 365.2425);
    document.getElementById("age").textContent = ageInYears.toFixed(10);
    requestAnimationFrame(updateAge);
  }

  requestAnimationFrame(updateAge);

  function scrollToSection(sectionId) {
    document.getElementById(sectionId).scrollIntoView({ behavior: "smooth" });
  }
</script>
</body>
</html>
