<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhiram Kothagundu</title>
<style>
  body {
    font-family: Verdana, sans-serif;
    text-align: center;
    margin-top: 20%;
  }
  h1, h3 {
    margin: 10px;
  }
  span {
    color: rgb(0, 0, 0);
    font-weight: bold;
  }
</style>
</head>
<body>
  <h1>I'm Abhiram Kothagundu</h1>
  <h3>I'm <span id="age"></span> years old.</h3>

<script>
  const birthDate = new Date('2005-04-05T13:05:00Z');

  function updateAge() {
    const now = new Date();
    const ageInMilliseconds = now - birthDate;
    const ageInYears = ageInMilliseconds / (1000 * 60 * 60 * 24 * 365.2425);
    document.getElementById("age").textContent = ageInYears.toFixed(10);
    requestAnimationFrame(updateAge); // Schedule next frame
  }

  requestAnimationFrame(updateAge); // Start updating
</script>
</body>
</html>
