<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhiram Kothagundu</title>
<style>
  :root {
    --bg-color: white;
    --text-color: black;
    --arrow-color: rgba(0, 0, 0, 0.3);
    --arrow-hover-color: black;
  }

  body {
    font-family: 'Times New Roman', sans-serif;
    margin: 0;
    scroll-behavior: smooth;
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.3s, color 0.3s;
    position: relative;
  }

  canvas#bouncing-square {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
    width: 100%;
    height: 100%;
  }

  section {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  h1, h2, h3, p {
    margin: 10px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s ease forwards;
  }

  h1 { animation-delay: 0.3s; }
  h3 { animation-delay: 0.6s; }
  p, h2 { animation-delay: 0.9s; }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  span {
    color: var(--text-color);
    font-weight: bold;
  }

  .arrow {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    color: var(--arrow-color);
    cursor: pointer;
    opacity: 0;
    transition: color 0.3s, transform 0.3s, opacity 1s;
    animation: fadeArrow 1s 3s forwards;
  }

  @keyframes fadeArrow {
    to {
      opacity: 0.5;
    }
  }

  .arrow:hover {
    color: var(--arrow-hover-color);
    transform: translateX(-50%) translateY(5px);
    opacity: 1;
  }
</style>
</head>
<body>
  <canvas id="bouncing-square"></canvas>

  <!-- Main section -->
  <section id="main">
    <h1>I'm Abhiram Kothagundu</h1>
    <h3>I'm <span id="age"></span> years old.</h3>
    <div class="arrow" onclick="scrollToSection('about')">&#x25BC;</div>
  </section>

  <!-- About section -->
  <section id="about">
    <h2>About Me</h2>
    <p>I'm good at C++, Java, Python, and C#.</p>
    <div class="arrow" onclick="scrollToSection('test')">&#x25BC;</div>
  </section>

  <!-- Test section -->
  <section id="test">
    <h2>About You</h2>
    <p>F#ck You!</p>
  </section>

<script>
  const birthDate = new Date('2005-04-05T13:05:00Z');

  const ageElement = document.getElementById("age");

  let displayedAge = 0;

  function updateAge() {
    const now = new Date();
    const ageInMilliseconds = now - birthDate;
    const realAge = ageInMilliseconds / (1000 * 60 * 60 * 24 * 365.2425);

    // Smoothly animate displayedAge towards realAge
    displayedAge += (realAge - displayedAge) * 0.05; // smaller factor => smoother

    // Update display with 10 decimal precision
    ageElement.textContent = displayedAge.toFixed(10);

    requestAnimationFrame(updateAge);
  }

  requestAnimationFrame(updateAge);

  function scrollToSection(sectionId) {
    document.getElementById(sectionId).scrollIntoView({ behavior: "smooth" });
  }

  // Bouncing rainbow square
  const canvas = document.getElementById('bouncing-square');
  const ctx = canvas.getContext('2d');

  let square = {
    x: Math.random() * window.innerWidth,
    y: Math.random() * window.innerHeight,
    size: 20, // small and cute!
    dx: (Math.random() > 0.5 ? 1 : -1) * 2,
    dy: (Math.random() > 0.5 ? 1 : -1) * 2,
    hue: 0 // starting hue for rainbow
  };

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function animateSquare() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update color (rainbow cycling)
    square.hue = (square.hue + 1) % 360;
    ctx.fillStyle = `hsl(${square.hue}, 100%, 50%)`;

    // Draw square
    ctx.fillRect(square.x, square.y, square.size, square.size);

    // Update position
    square.x += square.dx;
    square.y += square.dy;

    // Bounce off edges
    if (square.x <= 0 || square.x + square.size >= canvas.width) {
      square.dx *= -1;
    }
    if (square.y <= 0 || square.y + square.size >= canvas.height) {
      square.dy *= -1;
    }

    requestAnimationFrame(animateSquare);
  }

  animateSquare();
</script>
</body>
</html>
