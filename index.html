<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhiram Kothagundu</title>
<style>
  :root {
    --bg-color: white;
    --text-color: black;
    --arrow-color: rgba(0, 0, 0, 0.3);
    --arrow-hover-color: black;
  }

  body {
    font-family: 'Times New Roman', sans-serif;
    margin: 0;
    scroll-behavior: smooth;
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.3s, color 0.3s;
  }

  section {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  h1, h2, h3, p {
    margin: 10px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 1s ease forwards;
  }

  h1 { animation-delay: 0.3s; }
  h3 { animation-delay: 0.6s; }
  p, h2 { animation-delay: 0.9s; }

  @keyframes fadeUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  span {
    color: var(--text-color);
    font-weight: bold;
  }

  .arrow {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    color: var(--arrow-color);
    cursor: pointer;
    opacity: 0;
    transition: color 0.3s, transform 0.3s, opacity 1s;
    animation: fadeArrow 1s 3s forwards;
  }

  @keyframes fadeArrow {
    to {
      opacity: 0.5;
    }
  }

  .arrow:hover {
    color: var(--arrow-hover-color);
    transform: translateX(-50%) translateY(5px);
    opacity: 1;
  }
</style>
</head>
<body>
  <!-- Main section -->
  <section id="main">
    <h1>I'm Abhiram Kothagundu</h1>
    <h3>I'm <span id="age"></span> years old.</h3>
    <div class="arrow" onclick="scrollToSection('about')">&#x25BC;</div>
  </section>

  <!-- About section -->
  <section id="about">
    <h2>About Me</h2>
    <p>I'm good at C++, Java, Python, and C#.</p>
    <div class="arrow" onclick="scrollToSection('test')">&#x25BC;</div>
  </section>

  <!-- Test section -->
  <section id="test">
    <h2>About You</h2>
    <p>F#ck You!</p>
  </section>

<script>
  const birthDate = new Date('2005-04-05T13:05:00Z');

  function updateAge() {
    const now = new Date();
    const ageInMilliseconds = now - birthDate;
    const ageInYears = ageInMilliseconds / (1000 * 60 * 60 * 24 * 365.2425);
    document.getElementById("age").textContent = ageInYears.toFixed(10);
    requestAnimationFrame(updateAge);
  }

  requestAnimationFrame(updateAge);

  function scrollToSection(sectionId) {
    document.getElementById(sectionId).scrollIntoView({ behavior: "smooth" });
  }
</script>
</body>
</html>
