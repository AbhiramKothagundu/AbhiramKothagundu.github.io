<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abhiram Kothagundu</title>
<style>
  :root {
    --bg-color: white;
    --text-color: black;
    --arrow-color: rgba(255, 255, 255, 0.3);
    --arrow-hover-color: black;
  }

  body {
    font-family: 'Times New Roman', sans-serif;
    margin: 0;
    scroll-behavior: smooth;
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: background-color 0.3s, color 0.3s;
  }

  section {
    width: 100%;
    height: 100vh; /* Full viewport height */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  h1, h2, h3, p {
    margin: 10px;
  }

  span {
    color: var(--text-color);
    font-weight: bold;
  }

  .arrow {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    color: var(--arrow-color);
    cursor: pointer;
    transition: color 0.3s, transform 0.3s, opacity 1s;
    opacity: 0;
  }

  .arrow.visible {
    opacity: 0.3;
  }

  .arrow:hover {
    color: var(--arrow-hover-color);
    transform: translateX(-50%) translateY(5px);
    opacity: 1;
  }

  /* Dark mode styles */
  body.dark {
    --bg-color: black;
    --text-color: white;
    --arrow-color: rgba(255, 255, 255, 0.3);
    --arrow-hover-color: white;
  }

  /* Toggle button styling */
  .toggle-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: none;
    border: 2px solid var(--text-color);
    color: var(--text-color);
    padding: 5px 10px;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s;
    border-radius: 5px;
  }

  .toggle-btn:hover {
    background-color: var(--text-color);
    color: var(--bg-color);
  }
</style>
</head>
<body>
  <!-- Toggle Button -->
  <button class="toggle-btn" onclick="toggleDarkMode()">Toggle Dark Mode</button>

  <!-- Main section -->
  <section id="main">
    <h1>I'm Abhiram Kothagundu</h1>
    <h3>I'm <span id="age"></span> years old.</h3>
    <div class="arrow" id="down-arrow" onclick="scrollToSection('about')">&#x25BC;</div>
  </section>

  <!-- About section -->
  <section id="about">
    <h2>About Me</h2>
    <p>I'm good at C++, Java, Python, and C#.</p>
  </section>

<script>
  const birthDate = new Date('2005-04-05T13:05:00Z');

  function updateAge() {
    const now = new Date();
    const ageInMilliseconds = now - birthDate;
    const ageInYears = ageInMilliseconds / (1000 * 60 * 60 * 24 * 365.2425);
    document.getElementById("age").textContent = ageInYears.toFixed(10);
    requestAnimationFrame(updateAge);
  }

  requestAnimationFrame(updateAge);

  function scrollToSection(sectionId) {
    document.getElementById(sectionId).scrollIntoView({ behavior: "smooth" });
  }

  // Toggle dark mode
  function toggleDarkMode() {
    document.body.classList.toggle('dark');
  }

  // Show the arrow after 3 seconds
  setTimeout(() => {
    document.getElementById("down-arrow").classList.add("visible");
  }, 3000);
</script>
</body>
</html>
